<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi HTML Media</title>
  </head>
  <body>
    <!-- IMAGE LOCAL -->
    <p>This is image from this project</p>
    <img
      src="../assets/icon-yt.png"
      alt="Ini adalah logo icon Youtube"
      width="100"
      height="100"
    />
    <br />
    <!-- IMAGE ONLINE -->
    <p>This is image from online site</p>
    <img
      width="100"
      height="100"
      src="https://i.pinimg.com/1200x/74/5c/f9/745cf981304e99b473a61e0325822053.jpg"
      alt="Ini adalah icon twitter"
    />
    <br />
    <!-- AUDIO -->
    <p>This is audio</p>
    <audio controls>
      <source
        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      />
    </audio>

    <!-- VIDEO -->
    <p>This is Video</p>
    <video controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" />
    </video>

    <!-- IFRAME -->
    <p>This is Iframe</p>
    <iframe
      frameborder="0"
      scrolling="no"
      src="https://freesound.org/embed/sound/iframe/803419/simple/large/"
      width="920"
      height="245"
    ></iframe>
    <br />
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/iViD0s-FAWI?si=_TJvRw3Sv_lpN2Mv"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/iViD0s-FAWI?si=_TJvRw3Sv_lpN2Mv&amp;controls=0"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />

    <a href="../index.html">Back to main menu</a>
  </body>
</html>
