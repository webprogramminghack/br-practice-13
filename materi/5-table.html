<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi HTML Table</title>
  </head>
  <body>
    <p>Tabel di HTML</p>
    <table border="1">
      <caption>
        Table Basic
      </caption>
      <tr>
        <td>Nama</td>
        <td>Umur</td>
        <td>Alamat</td>
      </tr>
      <tr>
        <td>Dicky Fernando</td>
        <td>40</td>
        <td>Jl Sadar</td>
      </tr>
    </table>
    <br />
    <table border="1">
      <caption>
        Rowspan Table
      </caption>
      <tr>
        <td rowspan="2">Nama</td>
        <td>Budi Doremi</td>
      </tr>
      <tr>
        <td>Dicky Fernando</td>
      </tr>
    </table>
    <br />
    <table border="1">
      <caption>
        Colspan Table
      </caption>
      <tr>
        <td colspan="2" style="text-align: center">Nama</td>
      </tr>
      <tr>
        <td>Dicky Fernando</td>
        <td>Kyra Rizky</td>
      </tr>
    </table>
    <br />
    <table border="1">
      <caption>
        Table Semantic
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Dicky Fernando</td>
          <td>41</td>
          <td>Jl Sadar</td>
        </tr>
      </tbody>
    </table>

    <a href="../index.html">Back to main menu</a>
  </body>
</html>
