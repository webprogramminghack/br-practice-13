<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Login Sederhana</title>
  </head>
  <body>
    <div class="login-container">
      <h1>Form Login</h1>
      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
          <span class="show-password" onclick="togglePassword()"
            >Lihat Password</span
          >
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const showPasswordText = document.querySelector(".show-password");
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          showPasswordText.textContent = "tutup password";
        } else {
          passwordInput.type = "password";
          showPasswordText.textContent = "lihat password";
        }
      }
    </script>
    <a href="../index.html">Back to main menu</a>
  </body>
</html>
